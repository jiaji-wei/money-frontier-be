[package]
name = "ticket-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["clock"] }
ethers-contract = { version = "2.0", default-features = false }
ethers-contract-derive = { version = "2.0", default-features = false }
ethers-core = { version = "2.0", default-features = false }
ethers-providers = { version = "2.0", default-features = false, features = ["rustls"] }
ethers-signers = { version = "2.0", default-features = false }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
